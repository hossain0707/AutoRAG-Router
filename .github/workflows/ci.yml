name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q autorag
      - name: Offline benchmark diagnostic and report
        run: |
          python -m benchmarks.run --dataset toy --out benchmarks/runs/ci-toy
          python -m benchmarks.report --run-dir benchmarks/runs/ci-toy
