name: Project journal preview (manual read-only)

# Owner decision 2026-10-27: NO automatic GitHub commits or pushes.
# This workflow runs only when manually dispatched. It never commits or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-journal:
    if: github.repository == 'hossain0707/AutoRAG-Router'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Preview journal locally in runner (no commit, no push)
        run: |
          set -euo pipefail
          python scripts/update_daily_log.py --repo . --event manual_preview
          git diff --stat -- docs/DAILY_LOG.md docs/.journal-state.json
          echo "Preview complete; no repository changes were published."
