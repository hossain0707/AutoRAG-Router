name: Daily source and project memory journal

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/DAILY_LOG.md'
      - 'docs/.journal-state.json'
  schedule:
    # Every day at 09:00 Asia/Seoul (UTC+9); GitHub may delay scheduled runs.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autorag-daily-journal-main
  cancel-in-progress: false

jobs:
  update-journal:
    if: github.repository == 'hossain0707/AutoRAG-Router'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate dated Git change journal
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python scripts/update_daily_log.py --repo . --event "$TRIGGER_EVENT"
      - name: Commit and push journal (if modified)
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DAILY_LOG.md docs/.journal-state.json; then
            echo "Journal already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DAILY_LOG.md docs/.journal-state.json
          git commit -m "chore(journal): capture daily project source changes"
          git push origin HEAD:main
