name: Expand AutoRAG source bundle
on:
  push:
    paths: ['AutoRAG-payload.tar.xz.b64']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified project archive
        run: |
          base64 --decode AutoRAG-payload.tar.xz.b64 | tar -xJf - --strip-components=1
          rm -f AutoRAG-payload.tar.xz.b64 .github/workflows/unpack.yml
      - name: Render optional promotional media
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/make_promo.py || echo "Media rendering skipped; core project remains deployable"
      - name: Commit complete project to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish tested AutoRAG Router v0.1.0 with demo assets" || exit 0
          git push origin HEAD:main
